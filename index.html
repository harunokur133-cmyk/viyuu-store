<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VIYUU | Premium Deri Cüzdan ve Çanta</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#0d0d0d;
color:white;
}

header{
display:flex;
justify-content:space-between;
align-items:center;
padding:25px 10%;
position:fixed;
width:100%;
background:rgba(0,0,0,.8);
backdrop-filter:blur(12px);
}

.logo{
font-size:32px;
font-weight:700;
letter-spacing:4px;
color:#D4AF37;
}

nav a{
color:white;
text-decoration:none;
margin-left:30px;
transition:.3s;
}

nav a:hover{
color:#D4AF37;
}

.hero{

height:100vh;

display:flex;

justify-content:center;

align-items:center;

flex-direction:column;

text-align:center;

padding:20px;

background:linear-gradient(rgba(0,0,0,.6),rgba(0,0,0,.8));

}

.hero h1{

font-size:65px;

margin-bottom:20px;

}

.hero p{

font-size:22px;

max-width:700px;

line-height:1.8;

color:#dddddd;

margin-bottom:40px;

}

button{

background:#D4AF37;

border:none;

padding:18px 45px;

font-size:18px;

border-radius:50px;

cursor:pointer;

transition:.3s;

}

button:hover{

transform:scale(1.05);

}

.products{

padding:90px 10%;

}

.products h2{

text-align:center;

font-size:40px;

margin-bottom:60px;

}

.grid{

display:grid;

grid-template-columns:repeat(auto-fit,minmax(250px,1fr));

gap:30px;

}

.card{

background:#1a1a1a;

border-radius:20px;

padding:25px;

text-align:center;

transition:.3s;

}

.card:hover{

transform:translateY(-10px);

}

.card img{

width:100%;

border-radius:15px;

}

.card h3{

margin:20px 0;

}

.price{

color:#D4AF37;

font-size:25px;

font-weight:bold;

}

footer{

text-align:center;

padding:35px;

background:#111;

margin-top:70px;

color:#888;

}

</style>

</head>

<body>

<header>

<div class="logo">VIYUU</div>

<nav>

<a href="#">Ana Sayfa</a>

<a href="#">Ürünler</a>

<a href="#">Hakkımızda</a>

<a href="#">İletişim</a>

</nav>

</header>

<section class="hero">

<h1>Luxury Leather Collection</h1>

<p>

Hakiki deri cüzdanlar ve çantalar...

Kaliteyi, zarafeti ve şıklığı tek yerde buluşturuyoruz.

</p>

<button>Alışverişe Başla</button>

</section>

<section class="products">

<h2>Öne Çıkan Ürünler</h2>

<div class="grid">

<div class="card">

<img src="https://picsum.photos/400/400?1">

<h3>Premium Deri Cüzdan</h3>

<p class="price">₺1.299</p>

</div>

<div class="card">

<img src="https://picsum.photos/400/400?2">

<h3>Luxury Deri Çanta</h3>

<p class="price">₺3.499</p>

</div>

<div class="card">

<img src="https://picsum.photos/400/400?3">

<h3>Classic Wallet</h3>

<p class="price">₺999</p>

</div>

</div>

</section>

<footer>

© 2026 VIYUU • Premium Leather

</footer>

</body>
</html>
